name: Build KytyPS5 (Linux)

# This fork's Linux build (Demon's Souls, see README.md): a push to any branch (every commit) or a
# pushed v* tag builds the release package and publishes it as a GitHub release, marked latest
# (README.md links to the latest one). A manual run (Actions > Build KytyPS5 (Linux) > Run workflow)
# does the same. The Windows workflow (.github/workflows/build.yml) does this for Windows.
on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Build (Linux x64)
    runs-on: ubuntu-24.04
    outputs:
      package: ${{ steps.name.outputs.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Package name
        id: name
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            name="KytyPS5-linux-$GITHUB_REF_NAME"
          else
            name="KytyPS5-linux-$(date -u +%Y%m%d)-${GITHUB_SHA:0:8}"
          fi
          echo "package=$name" >> "$GITHUB_OUTPUT"

      # The toolchain and the libraries the bundled SDL2 configures its backends with (README.md,
      # "Building on Linux"). Qt is not needed: the build is the emulator without the launcher.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld ninja-build cmake git python3 glslang-tools \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev \
            libxi-dev libxrandr-dev libxss-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libwayland-dev wayland-protocols

      # x86-64-v3 (AVX2, FMA, BMI2), not the runner CPU's extensions: the exe must run on other PCs.
      - name: Build
        env:
          KYTY_MARCH: x86-64-v3
        run: |
          ./build-linux.sh kyty_emulator
          ./build-linux.sh kyty_shader_precompile

      - name: Package
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          set -euo pipefail
          build=_Build/linux
          out="_Build/package/$PACKAGE"
          mkdir -p "$out/tools/local/static-precompile"
          cp "$build/kyty_emulator" "$build/kyty_shader_precompile" "$out"/
          cp tools/local/run_ds.sh "$out"/
          cp LICENSE "$out"/
          cp -r LICENSES "$out"/
          # The render-pass states the precompile program makes the seed file with (the same files
          # the Windows package carries): the first launch lists the game's shaders from its files.
          cp tools/local/static-precompile/pass-states.json "$out/tools/local/static-precompile/"
          cp tools/local/static-precompile/hints-*.hints "$out/tools/local/static-precompile/" 2>/dev/null || true
          chmod +x "$out/kyty_emulator" "$out/kyty_shader_precompile" "$out/run_ds.sh"
          cat > "$out/README.md" <<'EOF'
          # KytyPS5 (Linux x64) for Demon's Souls (PPSA01341)

          An experimental PS5 emulator. This package is the emulator and its shader precompile tool
          for Linux x86-64 (glibc), built for CPUs with AVX2 (x86-64-v3).

          ## Requirements

          - A 64-bit x86-64 CPU with AVX2 (Haswell/Excavator or newer)
          - A Vulkan 1.3-capable GPU with current drivers
          - A current Linux distribution (glibc 2.35 or newer)

          ## Run

          The game is Demon's Souls 01.007.000 or 01.005.000, as a folder (the one with `eboot.bin`)
          or as a ZArchive (`.zar`). `run_ds.sh` is the launcher; point it at the game and start it:

          ```
          KYTY_GAME="/path/to/Demon's Souls.zar" ./run_ds.sh
          ```

          `KYTY_GAME` defaults to `/mnt/4tb/REtro/ps5/Demon's Souls.zar`. The launcher prefers the
          `kyty_emulator` next to it (override with `KYTY_BIN`), renders at 1080p into a 1920x1080
          window and shows MangoHud when it is installed (`MANGO=1`; `MANGO=0` hides it). The first
          launch translates shaders in the background for a minute or two; later launches are faster.

          ## Shader precompile (optional)

          `kyty_shader_precompile` collects every shader and pipeline of the game into the static
          pipeline cache ahead of time, so a new area does not stall on its first pipelines. See the
          repository's `tools/local/static-precompile/README.md`.

          Sizeable parts of this program are under the third-party licenses in `LICENSES/` and
          `LICENSE`.
          EOF
          ls -l "$out"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.package }}
          path: _Build/package/
          if-no-files-found: error

  release:
    name: Publish release
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE: ${{ needs.linux.outputs.package }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.linux.outputs.package }}
          path: package

      - name: Release notes
        uses: actions/checkout@v4
        with:
          path: notes
          sparse-checkout: docs/RELEASE-NOTES.md
          sparse-checkout-cone-mode: false

      - name: Publish
        shell: bash
        run: |
          (cd package && zip -qr "../$PACKAGE.zip" "$PACKAGE")
          # A tag's own release, else a new tag named after the package at this commit.
          tag="$GITHUB_REF_NAME"
          [ "$GITHUB_REF_TYPE" = tag ] || tag="$PACKAGE"
          notes="Linux x64 build of ${GITHUB_SHA::8} for Demon's Souls (PPSA01341, versions 01.007.000 and 01.005.000). Unzip it and run ./run_ds.sh with KYTY_GAME set to the game; the README.md inside explains the rest."
          # The notes of this build (what changed, the per-PC shader caches, frame rates), when the commit has them.
          if [ -s notes/docs/RELEASE-NOTES.md ]; then notes="$(printf '%s\n\n%s' "$notes" "$(cat notes/docs/RELEASE-NOTES.md)")"; fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" "$PACKAGE.zip" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$PACKAGE.zip" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$PACKAGE" --notes "$notes" --latest
          fi
